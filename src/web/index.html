<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b1016">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Remote PC">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Remote PC</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
</head>
<body data-theme="clean">
<div class="bgl clean"></div><div class="bgl neon"></div><div class="bgl tactical"></div>
<main id="app"><p class="loading">Connecting to your PC…</p></main>
<div id="msg" class="msg" role="status" aria-live="polite"></div>
<div id="banner" class="banner" hidden></div>
<div id="ask" class="ask" hidden>
  <div class="askbox" role="dialog" aria-modal="true" aria-labelledby="asktitle">
    <h2 id="asktitle"></h2>
    <p id="asktext"></p>
    <div class="row">
      <button type="button" id="askcancel" class="b">Cancel</button>
      <button type="button" id="askgo" class="b danger"></button>
    </div>
  </div>
</div>
<noscript><p>This page needs JavaScript.</p></noscript>
<script src="/app.js" defer></script>
</body>
</html>
