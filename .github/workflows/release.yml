name: release

# Builds RemotePc-Setup.exe on a Windows machine.
#   Push a tag like v0.2.0   -> the .exe is attached to a GitHub Release.
#   Run it by hand (Actions tab, "Run workflow") -> the .exe is kept as a download of that run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build RemotePc-Setup.exe
        shell: powershell
        run: |
          $env:RSP_VERSION = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\RemotePc.iss
          if (-not (Test-Path dist\RemotePc-Setup.exe)) { throw 'Setup.exe was not built' }
      - uses: actions/upload-artifact@v4
        with:
          name: RemotePc-Setup
          path: dist/RemotePc-Setup.exe
      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RemotePc-Setup.exe
          generate_release_notes: true
