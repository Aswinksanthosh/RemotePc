name: release

# Push a tag like v0.2.0 and this publishes a release with the program zip and its checksum file.
# The installer and the Update button take the newest release and refuse a zip that does not match SHASUMS256.txt.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - name: Build the zip and its checksum
        run: |
          git archive --format=zip --prefix=remortstartpc/ -o remortstartpc.zip HEAD
          sha256sum remortstartpc.zip > SHASUMS256.txt
          cat SHASUMS256.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" remortstartpc.zip SHASUMS256.txt --title "$GITHUB_REF_NAME" --generate-notes
